services:
  postgres:
    image: postgres:16-alpine
    container_name: swp_postgres
    restart: always
    environment:
      POSTGRES_DB: studywork_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - swp_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

volumes:
  swp_pgdata:
